<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Marketing Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171423;
    --panel: #211D33;
    --accent: #B24BF3;
    --accent2: #3DDC97;
    --text: #EFE9FA;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .shell {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 760px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
    border: 1px solid rgba(127,127,127,0.15);
  }

  header {
    padding: 22px 26px;
    border-bottom: 1px solid rgba(127,127,127,0.15);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .badge {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--accent);
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Poppins', serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 2px 0 0;
    font-size: 13px;
    opacity: 0.65;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .bot {
    align-self: flex-start;
    background: rgba(127,127,127,0.12);
    border-bottom-left-radius: 4px;
  }

  .user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 14px 16px;
    background: rgba(127,127,127,0.12);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent2);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid rgba(127,127,127,0.15);
  }

  #msg {
    flex: 1;
    border: 1px solid rgba(127,127,127,0.25);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }

  #msg:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  @media (max-width: 480px) {
    .shell { height: 92vh; border-radius: 12px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="badge"></div>
      <div>
        <h1>Digital Marketing Guide</h1>
        <p>Ask about SEO, social media, ads, or content strategy.</p>
      </div>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="msg" type="text" placeholder="Type your question..." autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('msg');
  const sendBtn = document.getElementById('send');

  function addMessage(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  addMessage("Ask about SEO, social media, ads, or content strategy.", 'bot');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || "Sorry, something went wrong.", 'bot');
    } catch (err) {
      hideTyping();
      addMessage("Network error. Please check your connection and try again.", 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
